name: DMM同人ランキング自動投稿

# ⚠️ このワークフローは BUFFER_API_KEY / BUFFER_CHANNEL_IDS を secrets に設定すると、
#    生成したスレッドをBufferのキューに登録し、Buffer側の投稿スケジュールに従って
#    人間の承認を挟まず自動的にXへ本投稿します（saveToDraft=false）。
#    実行前に投稿内容・アカウント設定・Xの利用規約（自動化ポリシー、
#    成人向けコンテンツポリシー等）を十分ご確認ください。
#    生成したテキストはArtifactとしても保存されます（事後確認用）。

on:
  schedule:
    # 毎日 08:00 JST (=UTC 23:00 前日) に実行。時間を変えたい場合はここを編集してください。
    - cron: '0 23 * * *'
  workflow_dispatch: {}  # 手動実行もできるようにしておく

permissions:
  contents: write  # 重複除外用の履歴ファイル・投稿ログをコミットし直すために必要

# 手動実行と定期実行が重なると、投稿ログ(outputs/dmm_doujin_post_log.json)が競合して
# 同じ枠に2件予約されたり、画像上限の判定がずれたりするため直列化する
concurrency:
  group: doujin-x-post
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install requests

      - name: 出力先ディレクトリを作成
        run: mkdir -p outputs

      - name: 下書き生成スクリプトを実行
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          OUTPUT_DIR: ${{ github.workspace }}/outputs
          # 必要に応じて調整してください
          # 【Xの新ルール対応】連投は自分の投稿同士で評価を食い合うため、1日2スレッド
          RANK_COUNT: '2'
          FETCH_HITS: '30'
          HISTORY_KEEP_DAYS: '30'
          # --- Buffer連携（任意。両方設定した場合のみ本投稿としてBufferに自動送信）---
          # saveToDraft=false のため、人間の承認なしにBuffer側のスケジュールで自動公開されます。
          # 予約は「昼12-13時・夜20-22時の枠に1スレッドずつ」（JST）。Buffer側のスケジュールには任せない。
          BUFFER_SCHEDULING_MODE: 'customScheduled'
          POST_WINDOWS: '[[12,13],[20,22]]'
          # 成人向けサンプル画像は「直近5スレッド中この件数まで」（残りはテキストのみ）。
          # 直近5投稿中3件で警告→フォロワー外に一切表示されなくなるため、1を推奨。
          # 同じXアカウントへ別ツールからも画像投稿している場合は 0 にする。
          ADULT_MEDIA_MAX_IN_LAST5: ${{ vars.ADULT_MEDIA_MAX_IN_LAST5 || '1' }}
          IMAGES_IN_MAIN: ${{ vars.IMAGES_IN_MAIN || '4' }}
          # 未成年を想起させる作品の除外（アカウント停止リスク回避）。追加語はカンマ区切りで指定
          EXCLUDE_MINOR_THEMED: 'true'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          python dmm_doujin_ranking_draft.py | tee outputs/draft_$(date +%Y-%m-%d).txt

      - name: 下書きをArtifactとしてアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doujin-draft-${{ github.run_id }}
          path: outputs/draft_*.txt
          retention-days: 14
          if-no-files-found: warn

      - name: 重複判定用の履歴ファイルをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f outputs/dmm_doujin_ranking_history.json ]; then
            git add outputs/dmm_doujin_ranking_history.json
            [ -f outputs/dmm_doujin_post_log.json ] && git add outputs/dmm_doujin_post_log.json
            git diff --cached --quiet || git commit -m "chore: 同人ランキング投稿履歴を更新"
            git push
          else
            echo "履歴ファイルが存在しないためコミットをスキップします（スクリプトがエラー終了した可能性があります）"
          fi
